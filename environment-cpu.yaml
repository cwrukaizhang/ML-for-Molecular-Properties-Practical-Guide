name: learning-project
channels:
  - pytorch
  - rdkit
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  # Shared dependencies (platform-independent)
  - pandas=2.3.3
  - plotly=6.4.0
  - scikit-learn=1.7.2
  - optuna=4.6.0
  - lightgbm=4.6.0
  - numpy=1.26.4
  - ipykernel=7.1.0
  - openpyxl=3.1.5
  - matplotlib=3.10.8
  - jupyter=1.1.1
  - notebook=7.4.7
  - pip
  
  # Platform-specific PyTorch (handled by conda)
  # Conda will automatically select the appropriate version based on system
  - pytorch=2.7.0
  - torchvision=0.22.0
  - torchaudio=2.7.0
  
  # Dependencies that need pip installation
  - pip:
    # torch-geometric and its dependencies
    
    - torch-geometric==2.7.0
    - PubChemPy
    # RDKit (better via pip for specific version)
    - rdkit==2025.9.2
    - kaleido==1.2.0
    - shap==0.49.1
    # Captum
    - captum==0.8.0

    - torch-scatter
    - torch-sparse
    - torch-cluster
    - torch-spline-conv
    - -f https://data.pyg.org/whl/torch-2.7.0+cpu.html